<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login - Instagram Auto Upload</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Kartu Login di Tengah */
    .login-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .login-box {
      background-color: #121212;
      border: 1px solid #262626;
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Logo Instagram Gradient */
    .logo-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      box-shadow: 0 8px 24px rgba(220, 39, 67, 0.4);
      margin-bottom: 20px;
    }

    .logo-wrapper svg {
      width: 36px;
      height: 36px;
      fill: #ffffff;
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .subtitle {
      font-size: 13px;
      color: #a8a8a8;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    /* Fitur Keunggulan */
    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
      text-align: left;
      background: #1a1a1a;
      border: 1px solid #262626;
      padding: 16px;
      border-radius: 10px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #d1d5db;
    }

    .feature-item svg {
      width: 16px;
      height: 16px;
      fill: #10b981;
      flex-shrink: 0;
    }

    /* Tombol Hubungkan */
    .btn-connect {
      width: 100%;
      background-color: #35b29f;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    .btn-connect:hover {
      background-color: #1877f2;
    }

    .btn-connect:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Spinner Animasi */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-note {
      font-size: 12px;
      color: #737373;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-box">
      <!-- Icon Gradien -->
      <div class="logo-wrapper">
        <svg viewBox="0 0 24 24">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
        </svg>
      </div>

      <h2>Instagram Auto Post</h2>
      <p class="subtitle">Kelola dan jadwalkan postingan Instagram Anda secara otomatis tanpa perlu membuka browser manual.</p>

      <!-- Checklist info -->
      <div class="feature-list">
        <div class="feature-item">
          <svg viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/></svg>
          <span>Login aman langsung via web resmi</span>
        </div>
        <div class="feature-item">
          <svg viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/></svg>
          <span>Sesi otomatis tersimpan di project</span>
        </div>
        <div class="feature-item">
          <svg viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/></svg>
          <span>Jadwal upload presisi dengan Playwright</span>
        </div>
      </div>

      <button id="btnLogin" class="btn-connect">
        <div id="btnSpinner" class="spinner"></div>
        <span id="btnText">Hubungkan Akun Instagram</span>
      </button>
    </div>

    <div class="footer-note">
      Kredensial dan sesi login Anda tersimpan secara lokal dan aman.
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
