<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    body {
      display: flex !important;
      flex-direction: column !important;
      height: 100vh !important;
      background: var(--bg-app) !important;
    }

    .account-select-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .brand-hero {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-hero h1 {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .brand-hero p {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* GRID PILIHAN PLATFORM & AKUN */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(240px, 280px));
      gap: 20px;
      max-width: 640px;
      width: 100%;
    }

    .platform-card {
      background: rgba(23, 25, 28, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .platform-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-primary);
      background: var(--bg-card-hover);
      box-shadow: none; border-color: rgba(53, 178, 159, 0.45);
    }

    .platform-icon-circle {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .platform-card h2 {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .platform-card span.desc {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 20px;
    }

    .btn-action-pill {
      width: 100%;
      padding: 9px 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9px;
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .platform-card:hover .btn-action-pill {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
    }

    /* KARTU AKUN (STEP 2) */
    .account-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      max-width: 780px;
      width: 100%;
    }

    .account-card-item {
      background: rgba(23, 25, 28, 0.75);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .account-card-item:hover {
      transform: translateY(-2px);
      border-color: var(--accent-primary);
      background: var(--bg-card-hover);
      box-shadow: none; border-color: rgba(53, 178, 159, 0.45);
    }

    .account-card-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #24272b;
      margin-bottom: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .account-card-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .account-card-name {
      font-size: 14.5px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .account-card-status {
      font-size: 11px;
      color: var(--success);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 16px;
    }

    .account-card-item:hover .btn-action-pill {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
    }

    .add-account-card {
      border: 1px dashed var(--border-subtle);
      background: rgba(255, 255, 255, 0.02);
      justify-content: center;
    }

    .add-account-card:hover {
      border-color: #f0bb85;
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-back-platform {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.2s ease;
    }

    .btn-back-platform:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- TITLE BAR -->
  <div class="custom-titlebar">
    <div class="titlebar-left">
      <div class="titlebar-app-badge">
        <span class="pulse-indicator"></span>
        <span class="badge-text">AutoUpload Core</span>
      </div>
    </div>
    <div class="titlebar-drag-region"></div>
    <div class="window-controls">
      <button type="button" class="win-btn" id="btnWinMinimize" title="Minimize">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6H10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="win-btn win-close" id="btnWinClose" title="Tutup">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M3 3L9 9M9 3L3 9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <div class="account-select-container">
    
    <!-- TAHAP 1: PILIH PLATFORM (DEFAULT DITAMPILKAN) -->
    <div id="stepChoosePlatform" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div class="brand-hero">
        <h1>Pilih Platform Otomatisasi</h1>
        <p>Pilih sosial media tujuan yang ingin dikelola postingan dan jadwalnya</p>
      </div>

      <div class="cards-grid">
        <!-- Kartu Instagram -->
        <div class="platform-card" id="btnSelectInstagram">
          <div class="platform-icon-circle" style="background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="#fff">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
          </div>
          <h2>Instagram</h2>
          <span class="desc">Auto Post Feed, Carousel & Reels</span>
          <button type="button" class="btn-action-pill">Masuk Akun</button>
        </div>

        <!-- Kartu TikTok -->
        <div class="platform-card" id="btnSelectTiktok">
          <div class="platform-icon-circle" style="background: #000; border: 1px solid rgba(255, 255, 255, 0.1);">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="#fff">
              <path d="M19.589 6.686a4.793 4.793 0 0 1-3.77-4.245V2h-3.445v13.672a2.896 2.896 0 0 1-2.887 2.887 2.896 2.896 0 0 1-2.886-2.887 2.896 2.896 0 0 1 2.886-2.886c.348 0 .68.064.987.18V9.435a6.34 6.34 0 0 0-.987-.078 6.34 6.34 0 0 0-6.333 6.333 6.34 6.34 0 0 0 6.333 6.333 6.34 6.34 0 0 0 6.333-6.333V9.011a8.167 8.167 0 0 0 5.164 1.838V7.404a4.815 4.815 0 0 1-1.396-.718z"/>
            </svg>
          </div>
          <h2>TikTok</h2>
          <span class="desc">Auto Pilot Video Shorts & Sound</span>
          <button type="button" class="btn-action-pill">Kelola Akun</button>
        </div>
      </div>
    </div>

    <!-- TAHAP 2: PILIH AKUN SESUAI PLATFORM -->
    <div id="stepChooseAccount" style="display: none; width: 100%; flex-direction: column; align-items: center;">
      <button type="button" class="btn-back-platform" id="btnBackToPlatform">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        <span>Ganti Platform</span>
      </button>

      <div class="brand-hero">
        <h1 id="selectedPlatformTitle">Pilih Akun</h1>
        <p id="selectedPlatformSub">Pilih sesi akun untuk mulai mengelola jadwal dan otomatisasi postingan</p>
      </div>

      <div class="account-cards-grid" id="selectAccountList">
        <!-- Render dinamis kartu akun Instagram atau TikTok -->
      </div>
    </div>

  <script type="module" src="js/selectAccount.js"></script>
</body>
</html>
