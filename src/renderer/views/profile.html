<div class="studio-card">
  <div class="ig-profile-header">
    <div class="ig-profile-avatar-col">
      <div class="avatar-large-wrapper">
        <span class="note-bubble">Note...</span>
        <img id="profilePageAvatar" src="" alt="avatar" referrerpolicy="no-referrer" crossorigin="anonymous">
      </div>
    </div>

    <div class="ig-profile-info-col">
      <div class="username-actions-row">
        <h2 class="profile-title-username" id="profilePageUsername">Memuat profil...</h2>
        <button id="btnRefreshProfile" class="chip-btn" style="display: flex; align-items: center; gap: 6px;">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          Refresh Profil
        </button>
      </div>

      <ul class="profile-stats-row">
        <li><strong id="statPostsCount">0</strong> posts</li>
        <li><strong id="statFollowersCount">0</strong> followers</li>
        <li><strong id="statFollowingCount">0</strong> following</li>
      </ul>

      <div class="profile-bio-details">
        <div class="bio-category" id="bioCategoryText">AKUN KREATOR</div>
        <div class="bio-text" id="bioBodyText"></div>
        <a class="bio-link" id="bioLinkAnchor" href="#" target="_blank" style="display: none;">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5-2.24-5-5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
          <span id="bioLinkText">Link Profil</span>
        </a>
      </div>
    </div>
  </div>

  <div class="highlights-section">
    <div class="highlight-item">
      <div class="highlight-circle"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>
      <span class="highlight-label">New</span>
    </div>
  </div>

  <div class="profile-tabs-nav">
    <button class="profile-tab active"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3V3zm11 0h7v7h-7V3zm-11 11h7v7H3v-7zm11 0h7v7h-7v-7z"/></svg><span>POSTS</span></button>
    <button class="profile-tab"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg><span>REELS</span></button>
    <button class="profile-tab"><svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg><span>SAVED</span></button>
    <button class="profile-tab"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><span>TAGGED</span></button>
  </div>

  <div class="posts-grid-ig" id="postsContainer">
    <div style="grid-column: span 3; text-align: center; padding: 50px 0; color: var(--text-dim);">Belum ada video yang diunggah.</div>
  </div>
</div>
