<div class="studio-card">
  <div class="card-header-row">
    <div class="card-header-left">
      <h2>Otomatisasi Penuh (One-Click Auto Pipeline)</h2>
      <p>Perancangan konsep visual, render otomatis, caption cerdas, hingga pendaftaran ke antrean jadwal.</p>
    </div>
    <span class="model-tag">Gemini 3.5 + ChatGPT + Flow</span>
  </div>

  <div class="mode-switch-wrapper">
    <button type="button" id="tabAutoPilotImageMode" class="mode-btn active">
      <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.5" stroke-width="2"/><path stroke-width="2" d="m21 15-5-5L5 21"/></svg>
      <span>Auto Pilot Gambar Feed</span>
    </button>
    <button type="button" id="tabAutoPilotVideoMode" class="mode-btn">
      <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="m15 10 4.553-2.276A1 1 0 0 1 21 8.618v6.764a1 1 0 0 1-1.447.894L15 14v-4Z"/><rect width="14" height="14" x="1" y="5" rx="2" stroke-width="2"/></svg>
      <span>Auto Pilot Video Reels (AI)</span>
    </button>
  </div>

  <div class="form-group">
    <div class="form-label-row"><span class="form-label">Template Cepat (Opsional)</span></div>
    <div class="chips-scroll">
      <button type="button" class="chip-btn btn-quick-topic" data-topic="Canva Pro Lifetime Garansi">Canva Pro</button>
      <button type="button" class="chip-btn btn-quick-topic" data-topic="Netflix Premium 4K Ultra HD">Netflix 4K</button>
      <button type="button" class="chip-btn btn-quick-topic" data-topic="Spotify Premium Bebas Iklan">Spotify</button>
      <button type="button" class="chip-btn btn-quick-topic" data-topic="CapCut Pro Full Garansi Resmi">CapCut Pro</button>
      <button type="button" class="chip-btn btn-quick-topic" data-topic="YouTube Premium No Ads Termurah">YouTube Premium</button>
    </div>
  </div>

  <div class="form-group">
    <div class="form-label-row">
      <label for="autoPilotTopic" class="form-label">Topik Produk / Konten</label>
      <span class="form-hint">Contoh: Canva Pro, Netflix Murah, dll.</span>
    </div>
    <input type="text" id="autoPilotTopic" class="input-box" placeholder="Ketik deskripsi produk atau promo di sini...">
  </div>

  <div id="containerAutoPilotImageForm">
    <div class="form-grid-2">
      <div class="form-group">
        <div class="form-label-row"><label for="autoPilotRatio" class="form-label">Format Rasio Feed</label></div>
        <select id="autoPilotRatio" class="input-box">
          <option value="4:5" selected>Potret 4:5 (Rekomendasi Feed)</option>
          <option value="1:1">Persegi 1:1 (Standar)</option>
          <option value="16:9">Lanskap 16:9 (Horizontal)</option>
        </select>
      </div>

      <div class="form-group">
        <div class="form-label-row"><label for="autoPilotImageScheduleTime" class="form-label">Waktu Publikasi Otomatis</label></div>
        <input type="datetime-local" id="autoPilotImageScheduleTime" class="input-box">
        <div class="quick-time-row">
          <button type="button" class="time-pill btn-auto-time" data-target="autoPilotImageScheduleTime" data-minutes="10">+10 Mnt</button>
          <button type="button" class="time-pill btn-auto-time" data-target="autoPilotImageScheduleTime" data-minutes="30">+30 Mnt</button>
          <button type="button" class="time-pill btn-auto-time" data-preset="tomorrow-morning">Besok 09:00</button>
        </div>
      </div>
    </div>

    <button type="button" id="btnRunAutoPilot" class="btn-execute">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <span>Jalankan Auto Pilot Gambar Feed</span>
    </button>
  </div>

  <div id="containerAutoPilotVideoForm" style="display: none;">
    <div class="form-grid-2">
      <div class="form-grid-2">
        <div class="form-group">
          <div class="form-label-row"><label for="autoPilotVideoRatio" class="form-label">Format Rasio Video</label></div>
          <select id="autoPilotVideoRatio" class="input-box">
            <option value="9:16" selected>Vertikal 9:16 (Reels / Shorts)</option>
            <option value="4:5">Potret 4:5 (Instagram Feed)</option>
            <option value="16:9">Lanskap 16:9 (Horizontal)</option>
          </select>
        </div>

        <div class="form-group">
          <div class="form-label-row"><label for="autoPilotVideoCharacter" class="form-label">Karakter Pinterest</label></div>
          <input type="text" id="autoPilotVideoCharacter" class="input-box" value="wanita" placeholder="Kata kunci pinterest...">
        </div>
      </div>
    </div>

    <div class="form-grid-2">
      <div class="form-grid-2">
        <div class="form-group">
          <div class="form-label-row"><label for="autoPilotVideoStoryboardType" class="form-label">Tipe Alur Storyboard</label></div>
          <select id="autoPilotVideoStoryboardType" class="input-box">
            <option value="1" selected>1. PROBLEM–SOLUTION (Direkomendasikan)</option>
            <option value="2">2. PRODUCT B-ROLL</option>
            <option value="3">3. DEMONSTRATION</option>
            <option value="4">4. EDUCATION</option>
            <option value="5">5. LIFESTYLE</option>
          </select>
        </div>

        <div class="form-group">
          <div class="form-label-row"><label for="autoPilotVideoScheduleTime" class="form-label">Waktu Publikasi Otomatis</label></div>
          <input type="datetime-local" id="autoPilotVideoScheduleTime" class="input-box">
          <div class="quick-time-row">
            <button type="button" class="time-pill btn-auto-time" data-target="autoPilotVideoScheduleTime" data-minutes="15">+15 Mnt</button>
            <button type="button" class="time-pill btn-auto-time" data-target="autoPilotVideoScheduleTime" data-minutes="30">+30 Mnt</button>
            <button type="button" class="time-pill btn-auto-time" data-preset="tomorrow-morning">Besok 09:00</button>
          </div>
        </div>
      </div>
    </div>

    <button type="button" id="btnRunAutoPilotVideo" class="btn-execute" style="background: linear-gradient(135deg, #e8a25c 0%, #e8a25c 100%);">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="m15 10 4.553-2.276A1 1 0 0 1 21 8.618v6.764a1 1 0 0 1-1.447.894L15 14v-4Z"/><rect width="14" height="14" x="1" y="5" rx="2" stroke-width="2"/></svg>
      <span>Jalankan Auto Pilot Video Reels (Banner + Storyboard + Flow 1080p)</span>
    </button>
  </div>

  <div id="autoPilotProgressBox" style="display: none; margin-top: 24px;" class="studio-card">
    <div style="font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 12px; display: flex; justify-content: space-between;">
      <span id="autoPilotStatusTitle">Sedang Memproses...</span>
      <span id="autoPilotPercent" style="color: var(--accent-primary);">0%</span>
    </div>
    <div style="width: 100%; height: 6px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; margin-bottom: 12px;">
      <div id="autoPilotProgressBar" style="width: 0%; height: 100%; background: var(--accent-gradient); transition: width 0.4s ease;"></div>
    </div>
    <div id="autoPilotLogs" style="font-family: monospace; font-size: 11.5px; color: var(--text-muted); line-height: 1.6; max-height: 140px; overflow-y: auto;"></div>
  </div>

  <div id="autoPilotAlert" class="alert-card" style="margin-top: 16px;"></div>
</div>
