<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoUpload Core</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/schedule.css">
  <link rel="stylesheet" href="css/storage.css">
  <link rel="stylesheet" href="css/profile.css">
  <style>
    .view-container { display: none !important; }
    .view-container.active-view { display: block !important; }
    #viewAiVideo.active-view { display: block !important; }
    #viewAiVideo .studio-card { padding: 20px 24px !important; margin-bottom: 20px !important; }
    #viewAiVideo .card-header-row { margin-bottom: 12px !important; }
    #viewAiVideo .card-header-left h2 { font-size: 17px !important; margin-bottom: 3px !important; }
    #viewAiVideo .card-header-left p { font-size: 12px !important; margin-top: 0 !important; }
    #viewAiVideo .form-group { margin-bottom: 14px !important; }
    #viewAiVideo .form-label-row { margin-bottom: 6px !important; display: flex; justify-content: space-between; align-items: center; }
    #viewAiVideo .form-label { font-size: 11px !important; letter-spacing: 0.3px !important; }
    #viewAiVideo .form-grid-4 { display: grid !important; grid-template-columns: repeat(4, 1fr) !important; gap: 10px !important; margin-bottom: 10px !important; }
    #viewAiVideo .form-grid-2 { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 10px !important; margin-bottom: 10px !important; }
    #viewAiVideo .input-box { padding: 8px 12px !important; font-size: 12.5px !important; height: 38px !important; }
    #viewAiVideo textarea.input-box { height: 48px !important; min-height: 48px !important; max-height: 60px !important; padding: 8px 12px !important; resize: vertical !important; font-size: 12.5px !important; }
    #viewAiVideo #btnRunFullReelsPipeline { padding: 10px 18px !important; font-size: 13.5px !important; height: 42px !important; margin-top: 6px !important; }
    #viewAiVideo #btnFlowToJJFromStoryboard { padding: 10px 18px !important; font-size: 13px !important; height: 40px !important; }
    #viewAiVideo #btnCreateJJCapcut { padding: 10px 18px !important; font-size: 13px !important; height: 40px !important; }
    #viewAiVideo #videoProgressBox { margin-top: 12px !important; padding: 12px 16px !important; background: rgba(10, 14, 26, 0.95) !important; border: 1px solid rgba(255, 255, 255, 0.08) !important; border-radius: var(--radius-md) !important; }
    #viewAiVideo #videoLogs { max-height: 90px !important; overflow-y: auto !important; font-size: 11px !important; line-height: 1.45 !important; scrollbar-width: thin; }
    #viewAiVideo .alert-card { margin-top: 10px !important; padding: 8px 14px !important; font-size: 12px !important; }

    /* Perbaikan baris unggah Pinterest agar fleksibel dan tidak menciut */
    #viewAiVideo .upload-field-row,
    #viewAiVideo #rowPinterestUpload {
      transition: all 0.2s ease-in-out;
    }
    #viewAiVideo #rowPinterestUpload.hidden-concept {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- CUSTOM TITLEBAR -->
  <div class="custom-titlebar">
    <div class="titlebar-left">
      <div class="titlebar-app-badge">
        <span class="pulse-indicator"></span>
        <span class="badge-text">AutoUpload Core</span>
      </div>
    </div>
    <div class="titlebar-drag-region"></div>
    <div class="window-controls">
      <button type="button" class="win-btn win-min" id="btnWinMinimize" title="Minimize">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6H10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="win-btn win-max" id="btnWinMaximize" title="Maximize">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><rect x="2.5" y="2.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button type="button" class="win-btn win-close" id="btnWinClose" title="Tutup">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M3 3L9 9M9 3L3 9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <!-- SIDEBAR NAVIGATION -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand-header">
        <div class="brand-icon" id="mainBrandIcon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
        </div>
        <span class="brand-title">AutoUpload</span>
      </div>

      <nav class="nav-menu">
        <a class="nav-item" id="tabAutoPilot"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg><span>Auto Pilot (1-Klik)</span></a>
        <a class="nav-item active" id="tabSchedule"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Buat Jadwal</span></a>
        <a class="nav-item" id="tabAiImage"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 5.6L10 0l2.5 5.6L18 8l-5.5 2.4L10 16 7.5 10.4 2 8l5.5-2.4zm10 8.4l1.5-3.4 1.5 3.4 3.5 1.6-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.6z"/></svg><span>Buat Gambar AI</span></a>
        <a class="nav-item" id="tabGallery"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg><span>Galeri Gambar</span></a>
        <a class="nav-item" id="tabAiVideo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2z"/></svg><span>Buat Video Reels</span></a>
        <a class="nav-item" id="tabVideoGallery"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg><span>Galeri Video</span></a>
        <a class="nav-item" id="tabShowcase">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span>Showcase Produk</span>
        </a>
        <a class="nav-item" id="tabProfile"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Profil & Postingan</span></a>
        <a class="nav-item" id="tabAiSettings"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1 0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"/></svg><span>Pengaturan AI</span></a>
      </nav>
    </div>

    <!-- AREA BAWAH SIDEBAR -->
    <div class="sidebar-footer">
      <div class="sidebar-ai-indicator" id="sidebarAiBadge" title="Buka Pengaturan AI">
        <div class="ai-status-left">
          <span class="status-dot dot-checking" id="sidebarAiDot"></span>
          <span class="ai-status-text" id="sidebarAiText">AI Memeriksa...</span>
        </div>
        <span class="model-tag" style="padding: 2px 8px; font-size: 10px;">Gemini & GPT</span>
      </div>

      <button type="button" id="btnSwitchPlatform" class="chip-btn" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 12px; margin-bottom: 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--radius-md); color: #cbd5e1; font-weight: 600; font-size: 12.5px; cursor: pointer; transition: all 0.2s ease;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        <span>Ganti Platform</span>
      </button>

      <div class="profile-badge" id="btnSidebarProfile" title="Kelola & Ganti Akun" style="cursor: pointer;">
        <div class="avatar" id="avatarContainer" style="width: 36px; height: 36px; min-width: 36px; border-radius: 50%; overflow: hidden; background: #1e293b; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#ffffff" style="display: block; opacity: 0.95;"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <div class="profile-badge-info">
          <div class="profile-username" id="displayUsername">Memuat...</div>
          <div class="profile-status"><span class="status-dot"></span><span>Sesi Aktif</span></div>
        </div>
        <button class="btn-logout" id="btnLogout" title="Keluar Akun">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- KONTEN UTAMA -->
  <main class="main-viewport">
    <div class="page-container">
      <div id="viewAutoPilot" class="view-container"></div>
      <div id="viewSchedule" class="view-container active-view"></div>
      <div id="viewAiImage" class="view-container"></div>
      <div id="viewGallery" class="view-container"></div>
      <div id="viewAiVideo" class="view-container"></div>
      <div id="viewVideoGallery" class="view-container"></div>
      <div id="viewShowcase" class="view-container" style="width: 100%;"></div>
      <div id="viewProfile" class="view-container profile-container"></div>
      <div id="viewAiSettings" class="view-container"></div>
      <div id="viewAccounts" class="view-container"></div>
    </div>
  </main>

  <!-- WADAH POPUP MODAL -->
  <div id="modalsContainer"></div>

  <!-- Inisialisasi Pemuat Skrip & Komponen -->
  <script type="module">
    import { loadDashboardComponents } from './js/componentLoader.js';

    try {
      // 1. Muat seluruh berkas parsial HTML terlebih dahulu
      await loadDashboardComponents();

      // 2. Import skrip utama dashboard
      await import('./js/dashboard.js');

      // 3. Picu inisialisasi modul UI setelah parser DOM selesai sepenuhnya
      requestAnimationFrame(() => {
        document.dispatchEvent(new Event('DOMContentLoaded'));
      });
    } catch (err) {
      console.error('[Dashboard Init Error]:', err);
    }
  </script>
</body>
</html>
